# ==============================================================
# Configuración de Controles del Mando (Gamepad / Control USB/BT)
# ==============================================================
# Mario AI Framework lee este archivo para mapear los botones del control.
# Acciones disponibles:
#   JUMP    - Saltar
#   SPEED   - Correr / Disparar bola de fuego
#   PAUSE   - Pausar partida
#   RESTART - Reiniciar nivel
#   NONE    - Sin acción asignada
#
# --------------------------------------------------------------
# Referencia de botones en Linux:
#
# Control de PlayStation 4 (DualShock 4 / DualSense):
#   Botón 0 = ✖ Equis (Cross)      -> JUMP
#   Botón 1 = ⭕ Círculo (Circle)    -> SPEED
#   Botón 2 = 🔺 Triángulo (Triangle) -> NONE (o JUMP)
#   Botón 3 = ⬛ Cuadrado (Square)   -> SPEED (Correr)
#   Botón 4 = L1                   -> SPEED
#   Botón 5 = R1                   -> SPEED
#   Botón 8 = Share                -> RESTART
#   Botón 9 = Options              -> PAUSE
#
# Control de Xbox (360 / One / Series):
#   Botón 0 = A                    -> JUMP
#   Botón 1 = B                    -> SPEED
#   Botón 2 = X                    -> SPEED (Correr)
#   Botón 3 = Y                    -> NONE (o JUMP)
#   Botón 4 = LB                   -> SPEED
#   Botón 5 = RB                   -> SPEED
#   Botón 6 = Back                 -> RESTART
#   Botón 7 = Start                -> PAUSE
# --------------------------------------------------------------

# Mapeo activo (Por defecto: Cuadrado = Correr, Equis = Saltar):
button.0=JUMP
button.1=SPEED
button.2=SPEED
button.3=SPEED
button.4=SPEED
button.5=SPEED
button.6=RESTART
button.7=PAUSE
button.8=RESTART
button.9=PAUSE

