<!-- ============ FILMINA: ANTECEDENTES · TABLA ============ -->

<style>
/* ---------- table ---------- */
.fpanel{position:absolute;left:60px;top:124px;width:250px}
.fpanel h3{margin:0 0 10px;font:400 10px/1.7 var(--pixel)}
.fbtn{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:10px;padding:10px 12px;border:3px solid var(--ink);background:#fff;font:600 15px var(--body);color:var(--ink);cursor:pointer;text-align:left;transition:transform .15s}
.fbtn:hover{transform:translateX(4px)}
.fbtn .bx{width:18px;height:18px;border:3px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.fbtn.on{background:var(--mint);box-shadow:4px 4px 0 var(--ink)}
.fbtn.on .bx{background:var(--ink)}
.fbtn.on .bx::after{content:"";width:6px;height:6px;background:var(--gold-l)}
.counter{margin-top:16px;border:3px solid var(--ink);background:var(--bg);padding:12px 14px;display:flex;align-items:center;gap:12px}
.counter .n{font:400 60px/1 var(--display)}
.counter .n small{font-size:30px;color:#777}
.counter .l{font:400 8px/1.8 var(--pixel)}
.win{margin-top:14px;padding:10px 12px;background:var(--gold-l);border:3px solid var(--ink);font:600 14px/1.45 var(--body);min-height:0}
.legend{margin-top:16px;font-size:12px;color:#555;line-height:1.7}
table.cmp{position:absolute;left:340px;top:124px;width:880px;border-collapse:separate;border-spacing:0 3px;font-size:15px}
.cmp th{font:600 14px var(--body);padding:0 6px;height:40px;text-align:center;background:var(--ink);color:#fff;cursor:pointer;user-select:none}
.cmp th:first-child{text-align:left;padding-left:14px;cursor:default}
.cmp th.on{background:var(--mint-d);color:var(--ink)}
.cmp th:hover:not(:first-child){background:var(--violet)}
.cmp td{height:34px;padding:0 6px;text-align:center;background:#f7f4f2;transition:opacity .4s,filter .4s,background .3s}
.cmp td:first-child{text-align:left;padding-left:14px;font-weight:500}
.cmp tr.dim td{opacity:.2;filter:grayscale(1)}
.cmp tr.me td{background:#fbeab8;font-weight:700;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.cmp tr.me td:first-child{border-left:3px solid var(--ink)} .cmp tr.me td:last-child{border-right:3px solid var(--ink)}
.cmp tr.me.dim td{opacity:.6;filter:none}
.cmp td.colon{background:#e6f6ef}
.cmp tr.me td.colon{background:#fbeab8}
.tg{display:inline-block;min-width:68px;padding:3px 8px;font:700 12px var(--body);border:2px solid var(--ink)}
.tg.y{background:var(--mint)} .tg.n{background:var(--pink)} .tg.p{background:var(--gold-l)}
</style>

  <section class="slide" id="s-table" data-min="0" data-max="4" data-sec="Antecedentes">
    <h1 class="h1">ANTECEDENTES</h1>
    <div class="fpanel">
      <h3>¿QUÉ ESTUDIOS CUMPLEN…?</h3>
      <button class="fbtn" data-col="4"><span class="bx"></span>Satisfacción</button>
      <button class="fbtn" data-col="5"><span class="bx"></span>Dificultad</button>
      <button class="fbtn" data-col="2"><span class="bx"></span>Telemetría</button>
      <button class="fbtn" data-col="3"><span class="bx"></span>Niveles humanos</button>
      <div class="counter"><div class="n"><span id="cnt">13</span><small>/13</small></div><div class="l">ESTUDIOS<br>QUE CUMPLEN</div></div>
      <div class="win pop-in" id="win">Nuestro estudio cumple los cuatro criterios!</div>
      <div class="legend">Solo <b>Sí</b> cuenta como «cumple».<br>Clic en los botones o en las columnas.</div>
    </div>
    <table class="cmp" id="cmp"><thead></thead><tbody></tbody></table>
  </section>

<script>
/* ============================================================
   ANTECEDENTES · TABLA CON FILTROS
   ============================================================ */
(function(){
  const COLS=['Artículo','Fecha','Telemetría','Niveles Humanos','Satisfacción','Dificultad'];
  const ROWS=[
    ["Teoi et al.",2026,"No","No","Sí","Sí"],
    ["Elshamy et al.",2026,"Sí","No","No","No"],
    ["Baharvand et al.",2026,"Sí","No","No","No"],
    ["Sanjaya & Djunaidy",2025,"Parcial","No","No","No"],
    ["Esteves et al.",2022,"Parcial","No","Sí","No"],
    ["Wang & Liu",2022,"Parcial","No","No","No"],
    ["Bicho & Martinho",2018,"Sí","No","No","No"],
    ["Shi & Chen",2018,"Parcial","No","No","No"],
    ["Fernández et al.",2017,"Sí","No","Parcial","No"],
    ["Summerville et al.",2016,"Sí","Sí","No","No"],
    ["Wheat et al.",2015,"Sí","No","Sí","No"],
    ["Stammer et al.",2015,"Sí","No","Sí","Sí"],
    ["Este Estudio",2026,"Sí","Sí","Sí","Sí"]
  ];
  const ORDER=[4,5,2,3];            // orden en que los pasos activan filtros
  const tb=document.querySelector('#cmp tbody'), th=document.querySelector('#cmp thead');
  th.innerHTML='<tr>'+COLS.map((c,i)=>`<th data-col="${i}">${c}</th>`).join('')+'</tr>';
  const cls={Sí:'y',No:'n',Parcial:'p'};
  tb.innerHTML=ROWS.map((r,ri)=>`<tr class="${ri===ROWS.length-1?'me':''}">`+r.map((c,i)=>
    i<2?`<td>${c}</td>`:`<td data-col="${i}"><span class="tg ${cls[c]}">${c}</span></td>`).join('')+'</tr>').join('');
  const trs=[...tb.rows], active=new Set(), cnt=document.getElementById('cnt'), win=document.getElementById('win');
  let wasWin=false;
  function apply(){
    let n=0;
    trs.forEach((tr,i)=>{ const ok=[...active].every(c=>ROWS[i][c]==='Sí'); tr.classList.toggle('dim',!ok); if(ok)n++; });
    document.querySelectorAll('#s-table [data-col]').forEach(e=>{ const c=+e.dataset.col; const on=active.has(c);
      if(e.tagName==='TD') e.classList.toggle('colon',on); else e.classList.toggle('on',on); });
    cnt.textContent=n;
    const w=active.size===4&&n===1; win.classList.toggle('show',w);
    if(w&&!wasWin&&slides[cur].id==='s-table') burst(1000,640,16);
    wasWin=w;
  }
  function toggle(c){ active.has(c)?active.delete(c):active.add(c); apply(); }
  document.querySelectorAll('#s-table .fbtn').forEach(b=>b.onclick=()=>{ b.blur(); toggle(+b.dataset.col); });
  document.querySelectorAll('#cmp th').forEach(t=>{ if(+t.dataset.col>=2) t.onclick=()=>toggle(+t.dataset.col); });
  H['s-table']={ step(n){ active.clear(); ORDER.slice(0,n).forEach(c=>active.add(c)); apply(); } };
  apply();
})();
</script>
