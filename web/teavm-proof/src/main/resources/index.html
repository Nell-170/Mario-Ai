<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prueba Java a navegador</title>
    <style>
        #stage { width: min(100%, 900px); overflow: hidden; background: #5c94fc; }
        #level { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <h1>Prueba de lógica Java compilada para el navegador</h1>
    <p id="status">Cargando nivel...</p>
    <div id="stage" tabindex="0">
        <canvas id="level" aria-label="Nivel Mario"></canvas>
    </div>
    <p>El nivel se conserva en el formato de texto del framework. ArrowRight mueve a Mario y R reinicia su posición.</p>
    <script type="module">
        const canvas = document.querySelector('#level');
        const context = canvas.getContext('2d');
        const status = document.querySelector('#status');
        const showError = error => {
            console.error(error);
            status.textContent = `Error al cargar la prueba: ${error.message}`;
        };

        try {
            const { load } = await import('./wasm-gc-module-runtime.js');
            const teavm = await load('./classes.wasm');
            const response = await fetch('./level.txt');
            if (!response.ok) {
                throw new Error(`level.txt respondió HTTP ${response.status}`);
            }
            const levelText = await response.text();
            const tileSize = 16;
            const viewportWidth = 900;
            const cameraLead = 300;
            const tileColors = {
                '-': '#5c94fc',
                'X': '#7c4a22',
                'S': '#9b5de5',
                '?': '#f5c542',
                'o': '#ffd166',
                'g': '#6a994e',
                '<': '#e76f51',
                '>': '#e76f51'
            };

            const clamp = (value, minimum, maximum) =>
                Math.max(minimum, Math.min(value, maximum));

            const getCameraX = () => {
                const levelWidth = teavm.exports.getLevelColumns() * tileSize;
                const maxCameraX = Math.max(0, levelWidth - canvas.width);
                return clamp(teavm.exports.getX() - cameraLead, 0, maxCameraX);
            };

            const drawMario = cameraX => {
                context.fillStyle = '#e52521';
                context.fillRect(
                    teavm.exports.getX() - cameraX,
                    canvas.height - tileSize * 2,
                    tileSize,
                    tileSize
                );
            };

            const drawLevel = () => {
                const rows = teavm.exports.getLevelRows();
                const columns = teavm.exports.getLevelColumns();
                canvas.width = Math.min(viewportWidth, columns * tileSize);
                canvas.height = rows * tileSize;
                const cameraX = getCameraX();
                const firstColumn = Math.floor(cameraX / tileSize);
                const lastColumn = Math.min(
                    columns,
                    Math.ceil((cameraX + canvas.width) / tileSize)
                );
                context.clearRect(0, 0, canvas.width, canvas.height);
                for (let row = 0; row < rows; row++) {
                    for (let column = firstColumn; column < lastColumn; column++) {
                        const tile = String.fromCharCode(teavm.exports.getTile(row, column));
                        const color = tileColors[tile];
                        if (color) {
                            context.fillStyle = color;
                            context.fillRect(
                                column * tileSize - cameraX,
                                row * tileSize,
                                tileSize,
                                tileSize
                            );
                        }
                    }
                }
                drawMario(cameraX);
            };

            teavm.exports.loadLevel(levelText);
            teavm.exports.main([]);
            drawLevel();
            status.textContent = `Nivel cargado desde texto: ${teavm.exports.getLevelColumns()} columnas. La cámara sigue a Mario.`;

            document.addEventListener('keydown', event => {
                if (event.key === 'ArrowRight') {
                    teavm.exports.step(true);
                    drawLevel();
                } else if (event.key.toLowerCase() === 'r') {
                    teavm.exports.reset();
                    drawLevel();
                }
            });
        } catch (error) {
            showError(error);
        }
    </script>
</body>
</html>
